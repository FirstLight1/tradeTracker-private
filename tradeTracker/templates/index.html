<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="../static/styles/auctions-aligment.css">
    <link rel="stylesheet" href="../static/styles/auctions-hollowKnightStyle.css">
    <link rel="stylesheet" href="../static/styles/header-align.css">
    <link rel="stylesheet" href="../static/styles/modal.css">
    <title>Trade Tracker</title>
    <link rel="icon" type="image/x-icon" href="../static/images/cardanvil.ico">
</head>
<body>
    <main>
        <h1>Trade<span class="shadow"></span> Tracker</h1>
        <div class="search-bar">
            <input type="text" class="search-field">
            <button class="search-btn">Search</button>
            <div class="search-results"></div>
        </div>
        <header class="header">
            <nav class="nav-bar compact-nav" aria-label="Main navigation">
                <a class="nav-page-link" href="{{ url_for('renderers.renderAuctions') }}">Home</a>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">Add</button>
                    <div class="nav-dropdown-menu">
                        <a href="{{ url_for('renderers.addAuction') }}">Auction</a>
                        <a href="{{ url_for('renderers.addSingles') }}">Singles</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">History</button>
                    <div class="nav-dropdown-menu">
                        <a href="{{ url_for('renderers.sold') }}">Sold</a>
                        <a href="{{ url_for('renderers.purchases') }}">Purchases</a>
                    </div>
                </div>
                <a class="nav-page-link" href="{{ url_for('grading.grading_render') }}">Grading</a>
                <button class="upload-csv-btn" type="button">Upload</button>
                <button class="sales-btn" type="button">Reports</button>
                <div class="inventory-value">
                    <p class="inventory-value-header">Inventory</p>
                    <p class="inventory-value-value"></p>
                </div>
            </nav>
        </header>
        <div class="shopping-cart">
            <div class="cart-content"></div>
            <div class="sealed-content"></div>
            <div class="bulk-cart-content"></div>
            <div class="holo-cart-content"></div>
            <div class="ex-cart-content"></div>
            <div>
                <input type="text" class="cart-bulk-input">
                <button class="card-add-bulk">Add bulk</button>
            </div>
            <div>
                <input type="text" class="cart-holo-input">
                <button class="card-add-holo">Add holo</button>
            </div>
            <div>
                <input type="text" class="cart-ex-input">
                <button class="card-add-ex">Add ex</button>
            </div>
            <div class="button-container">
                <button class="confirm-btn">Complete invoice</button>
                <button class="delete-cart"><img class="trashcan-icon" src="../static/images/trashcan-icon.webp"></button>
            </div>
        </div>
            <div id='alert-div'></div>
        <div>
            <div>
                <p>Bulk:</p>
                <p class="bulk-value"></p>
            </div>
            <div>
                <p>Holo:</p>
                <p class="holo-value"></p>
            </div>
            <div>
                <p>Ex:</p>
                <p class="ex-value"></p>
            </div>
        </div>
        <div>
            <div class="header-container">
                <div class="auction-header">
                    <p>Auction name</p>
                    <p>Auction price</p>
                </div>
            </div>
            <div class="content-container">
                <div class='sealed-container auction-tab'>
                        <p>Sealed</p>
                        <p></p>
                        <p></p>
                        <p></p>
                        <button class='view-sealed'>View</button>     
                        <p></p>
                        <div class='sealed-tab cards-container' hidden>
                            <div class='sealed-header'>
                                <p>Qty</p>
                                <p>Name</p>
                                <p>Lang</p>
                                <p>Price</p>
                                <p>no VAT</p>
                                <p>Market Value</p>
                                <p>Margin</p>
                                <p>Date</p>
                                <p></p>
                                <p></p>
                            </div>    
                            <div class='sealed-tab-content'>
                                <!--Sealded items load here -->
                            </div>
                            <div class='buttons-container'>
                            <button class='add-sealed'>Add Sealed</button>
                            <button class='save-sealed-btn' hidden>Save</button>
                            </div>
                        </div>
                </div>
                <div class="auction-container"></div>
            </div>
        </div>
    </main>
    <script type="module" src="../static/scripts/utils/renderUtil.js"></script>
    <script type="module" src="../static/scripts/utils/classes.js"></script>
    <script type="module" src="../static/scripts/utils/sanitizers.js"></script>
    <script type="module" src="../static/scripts/main.js"></script>
    <script type="module" src="/static/scripts/headerActions.js"></script>
    <script src="../static/vendor/purify.min.js"></script>
</body>
</html>
