<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="csrf-token" content="{{ csrf_token() }}" />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/auctions-aligment.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/auctions-hollowKnightStyle.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/creditnote-style.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/create-grading-style.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles/complete-grading-style.css') }}"
        />
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/header-align.css') }}" />
        <link rel="stylesheet" href="/static/styles/modal.css" />
        <title>Complete Grading Submission - Trade Tracker</title>
        <link
            rel="icon"
            type="image/x-icon"
            href="{{ url_for('static', filename='images/cardanvil.ico') }}"
        />
    </head>

    <body>
        <main data-submission-id="{{ submission_id }}">
            <h1>Complete<span class="shadow"></span> Grading Submission</h1>
            <header class="header">
                <nav class="nav-bar compact-nav" aria-label="Main navigation">
                    <a class="nav-page-link" href="{{ url_for('renderers.renderAuctions') }}"
                        >Home</a
                    >
                    <div class="nav-dropdown">
                        <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">
                            Add
                        </button>
                        <div class="nav-dropdown-menu">
                            <a href="{{ url_for('renderers.addAuction') }}">Auction</a>
                            <a href="{{ url_for('renderers.addSingles') }}">Singles</a>
                        </div>
                    </div>
                    <div class="nav-dropdown">
                        <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">
                            History
                        </button>
                        <div class="nav-dropdown-menu">
                            <a href="{{ url_for('renderers.sold') }}">Sold</a>
                            <a href="{{ url_for('renderers.purchases') }}">Purchases</a>
                        </div>
                    </div>
                    <a class="nav-page-link" href="{{ url_for('grading.grading_render') }}"
                        >Grading</a
                    >
                    <button class="upload-csv-btn" type="button">Upload</button>
                    <button class="sales-btn" type="button">Reports</button>
                    <div class="inventory-value">
                        <p class="inventory-value-header">Inventory</p>
                        <p class="inventory-value-value"></p>
                    </div>
                </nav>
            </header>
            <div class="back-btn-container">
                <button class="back-btn">
                    <a href="{{ url_for('grading.grading_render') }}"
                        ><img
                            class="back-arrow-img"
                            src="{{ url_for('static', filename='images/back-arrow.svg') }}"
                            alt="back arrow"
                        />Back</a
                    >
                </button>
            </div>
            <div id="alert-div"></div>
            <form class="creditnote-grid grading-submission-form grading-completion-form">
                <section class="creditnote-box creditnote-items">
                    <p class="creditnote-box-title">Submission {{ submission_id }} cards</p>
                    <p class="completion-help">
                        Enter the returned grade details for each card. Numeric grades must be from
                        0 to 10; market values cannot be negative.
                    </p>
                    <div class="completion-card-list" aria-live="polite">
                        <p class="completion-loading">Loading submission cards...</p>
                    </div>
                </section>
                <section class="creditnote-box creditnote-confirm">
                    <button class="confirm-btn" type="submit" disabled>Complete submission</button>
                </section>
            </form>
        </main>
        <script
            type="module"
            src="{{ url_for('static', filename='scripts/completeGrading.js') }}"
        ></script>
        <script type="module" src="/static/scripts/headerActions.js"></script>
    </body>
</html>
