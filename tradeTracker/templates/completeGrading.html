<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/auctions-aligment.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/header-align.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/auctions-hollowKnightStyle.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/creditnote-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/create-grading-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/complete-grading-style.css') }}">
    <title>Complete Grading Submission - Trade Tracker</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/cardanvil.ico') }}">
</head>

<body>
    <main data-submission-id="{{ submission_id }}">
        <h1>Complete<span class="shadow"></span> Grading Submission</h1>
        <header class="header">
            <nav class="nav-bar">
                <div>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/leftarrow.png') }}"
                            alt="left arrow"></span>
                    <button class="sales"><a href="{{ url_for('renderers.renderAuctions') }}">Sales</a></button>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/rightarrow.png') }}"
                            alt="right arrow"></span>
                </div>
                <div>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/leftarrow.png') }}"
                            alt="left arrow"></span>
                    <button class="addAuction"><a href="{{ url_for('renderers.addAuction') }}">Add auction</a></button>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/rightarrow.png') }}"
                            alt="right arrow"></span>
                </div>
                <div>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/leftarrow.png') }}"
                            alt="left arrow"></span>
                    <button class="addSingles"><a href="{{ url_for('renderers.addSingles') }}">Add Singles</a></button>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/rightarrow.png') }}"
                            alt="right arrow"></span>
                </div>
                <div>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/leftarrow.png') }}"
                            alt="left arrow"></span>
                    <button class="sold"><a href="{{ url_for('renderers.sold') }}">Sold</a></button>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/rightarrow.png') }}"
                            alt="right arrow"></span>
                </div>
                <div>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/leftarrow.png') }}"
                            alt="left arrow"></span>
                    <button class="collection"><a
                            href="{{ url_for('renderers.renderCollection') }}">Collection</a></button>
                    <span class="arrow left"><img src="{{ url_for('static', filename='images/rightarrow.png') }}"
                            alt="right arrow"></span>
                </div>
            </nav>
        </header>
        <div class="back-btn-container">
            <button class="back-btn"><a href="{{ url_for('grading.grading_render') }}"><img class="back-arrow-img"
                        src="{{ url_for('static', filename='images/back-arrow.svg') }}" alt="back arrow">Back</a></button>
        </div>
        <div id="alert-div"></div>
        <form class="creditnote-grid grading-submission-form grading-completion-form">
            <section class="creditnote-box creditnote-items">
                <p class="creditnote-box-title">Submission {{ submission_id }} cards</p>
                <p class="completion-help">Enter the returned grade details for each card. Fields may be left blank when
                    the grader did not provide a value.</p>
                <div class="completion-card-list" aria-live="polite">
                    <p class="completion-loading">Loading submission cards...</p>
                </div>
            </section>
            <section class="creditnote-box creditnote-confirm">
                <button class="confirm-btn" type="submit" disabled>Complete submission</button>
            </section>
        </form>
    </main>
    <script type="module" src="{{ url_for('static', filename='scripts/completeGrading.js') }}"></script>
</body>

</html>
