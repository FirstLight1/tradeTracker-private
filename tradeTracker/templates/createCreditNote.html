<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="../static/styles/auctions-aligment.css">
    <link rel="stylesheet" href="../static/styles/auctions-hollowKnightStyle.css">
    <link rel="stylesheet" href="../static/styles/creditnote-style.css">
    <link rel="stylesheet" href="../static/styles/header-align.css">
    <link rel="stylesheet" href="/static/styles/modal.css">
    <title>Trade Tracker</title>
    <link rel="icon" type="image/x-icon" href="../static/images/cardanvil.ico">
</head>

<body>
    <main>
        <h1>Credit<span class="shadow"></span> Note</h1>
        <header class="header">
            <nav class="nav-bar compact-nav" aria-label="Main navigation">
                <a class="nav-page-link" href="{{ url_for('renderers.renderAuctions') }}">Home</a>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">Add</button>
                    <div class="nav-dropdown-menu">
                        <a href="{{ url_for('renderers.addAuction') }}">Auction</a>
                        <a href="{{ url_for('renderers.addSingles') }}">Singles</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-trigger" type="button" aria-haspopup="true">History</button>
                    <div class="nav-dropdown-menu">
                        <a href="{{ url_for('renderers.sold') }}">Sold</a>
                        <a href="{{ url_for('renderers.purchases') }}">Purchases</a>
                    </div>
                </div>
                <a class="nav-page-link" href="{{ url_for('grading.grading_render') }}">Grading</a>
                <button class="upload-csv-btn" type="button">Upload</button>
                <button class="sales-btn" type="button">Reports</button>
                <div class="inventory-value">
                    <p class="inventory-value-header">Inventory</p>
                    <p class="inventory-value-value"></p>
                </div>
            </nav>
        </header>
        <div class="back-btn-container">
            <button class="back-btn"><a href="{{ url_for('renderers.sold') }}"><img class="back-arrow-img"
                        src="../static/images/back-arrow.svg" alt="back arrow">Back</a></button>
        </div>
        <div id="alert-div"></div>
        <div class="creditnote-grid">
            <section class="creditnote-box creditnote-sale-info">
                <p class="creditnote-box-title">Provider</p>
                <div class="creditnote-box-content"></div>
            </section>
            <section class="creditnote-box creditnote-receiver">
                <p class="creditnote-box-title">Receiver</p>
                <div class="creditnote-reciver-content"></div>
            </section>
            <section class="creditnote-box creditnote-items">
                <p class="creditnote-box-title">Items</p>
                <div class="creditnote-item-content"></div>
            </section>
            <section class="creditnote-box creditnote-total">
                <p>Total price</p>
                <div class="total-price"></div>
            </section>
            <section class="creditnote-box creditnote-confirm">
                <button class="confirm-btn">Confirm</button>
            </section>
        </div>
    </main>
    <script type="module" src="../static/scripts/utils/sanitizers.js"></script>
    <script type="module" src="../static/scripts/utils/renderUtil.js"></script>
    <script type="module" src="../static/scripts/createCreditNote.js"></script>
    <script type="module" src="/static/scripts/headerActions.js"></script>
    <script src="../static/vendor/purify.min.js"></script>
</body>

</html>
